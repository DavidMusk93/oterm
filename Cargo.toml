[package]
name = "oterm"
version = "0.1.0"
edition = "2021"
description = "oterm: State-of-the-art online web terminal in Rust with server-side TOTP auth, persistent PTY sessions, and resumable binary WebSocket streaming"
license = "MIT"
repository = "https://github.com/DavidMusk93/oterm"

[dependencies]
axum = { version = "0.8", features = ["ws", "macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
portable-pty = "0.9"
totp-rs = { version = "5", features = ["qr", "gen_secret", "otpauth"] }
qrcode = "0.14"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base32 = "0.5"
bytes = "1"
rust-embed = "8"
mime_guess = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
time = "0.3"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
