<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#131620" />
  <title>oterm — Online Terminal</title>
  <link rel="icon" type="image/svg+xml" href="./logo.svg?v=4" />
  <link rel="stylesheet" href="./xterm.css" />
  <link rel="stylesheet" href="./styles.css?v=4" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="topbar-left">
        <div class="brand" title="oterm: Online Terminal">
          <img class="brand-logo" src="./logo.svg?v=4" alt="oterm" width="22" height="22" />
          <span id="conn-dot" class="dot dot-offline"></span>
          <span class="brand-name">oterm</span>
          <span id="rtt-badge" class="badge">--ms</span>
        </div>
        <div id="tabs-bar" class="tabs-bar"></div>
        <button id="btn-new-tab" class="icon-btn" title="New terminal session (Alt+T)">+</button>
      </div>

      <div class="topbar-right">
        <span id="size-badge" class="badge hide-sm">80×24</span>
        <button id="btn-search" class="icon-btn" title="Search scrollback (Ctrl+Shift+F)">⌕</button>
        <button id="btn-font-dec" class="icon-btn hide-sm" title="Decrease font (Ctrl+-)">A-</button>
        <button id="btn-font-inc" class="icon-btn hide-sm" title="Increase font (Ctrl++)">A+</button>
        <select id="theme-select" class="theme-select hide-sm" title="Terminal theme">
          <option value="tokyo">Tokyo Night</option>
          <option value="catppuccin">Catppuccin</option>
          <option value="dracula">Dracula</option>
          <option value="gruvbox">Gruvbox</option>
          <option value="light">Solarized Light</option>
        </select>
        <button id="btn-ac-toggle" class="icon-btn active" title="Toggle smart autocomplete (→ ghost / Tab accept)">✦</button>
        <button id="btn-mobile-bar" class="icon-btn" title="Toggle touch key bar">⌨</button>
        <button id="btn-lock" class="lock-btn" title="Lock terminal now (sessions keep running in background; auto-locks when idle)">
          <span class="lock-icon">🔒</span>
          <span>Lock</span>
        </button>
      </div>
    </header>

    <div id="search-bar" class="search-bar hidden">
      <input id="search-input" type="text" placeholder="Search terminal..." autocomplete="off" spellcheck="false" />
      <button id="search-regex" class="mini-btn" title="Regex">.*</button>
      <button id="search-case" class="mini-btn" title="Match case">Aa</button>
      <button id="search-prev" class="mini-btn" title="Previous (Shift+Enter)">↑</button>
      <button id="search-next" class="mini-btn" title="Next (Enter)">↓</button>
      <button id="search-close" class="mini-btn" title="Close (Esc)">✕</button>
    </div>

    <main id="terminal-wrap">
      <div id="terminal-mount"></div>
      <div id="local-echo" class="local-echo hidden"></div>
      <div id="ac-ghost" class="ac-ghost hidden"></div>
      <div id="ac-popup" class="ac-popup hidden"></div>
      <div id="sticky-history-pill" class="sticky-pill hidden">
        <span id="sticky-lines-text" class="sticky-meta">↑ History</span>
        <button id="btn-sticky-prev" class="sticky-btn" title="Previous command block">↑ Prev</button>
        <button id="btn-sticky-next" class="sticky-btn" title="Next command block">↓ Next</button>
        <button id="btn-scroll-bottom" class="sticky-btn sticky-primary" title="Jump to latest output">↓ Latest</button>
      </div>
    </main>

    <footer id="context-bar" class="context-bar">
      <div class="ctx-left">
        <span id="ctx-cwd" class="ctx-chip ctx-cwd" title="Current working directory">~</span>
        <span id="ctx-branch" class="ctx-chip ctx-branch hidden" title="Git branch"></span>
        <span id="ctx-proc" class="ctx-chip ctx-proc" title="Foreground process">bash</span>
      </div>
      <div class="ctx-right">
        <button id="btn-prev-cmd" class="ctx-action hide-sm" title="Jump to previous command block">↑ Prev Cmd</button>
        <button id="btn-next-cmd" class="ctx-action hide-sm" title="Jump to next command block">↓ Next Cmd</button>
        <button id="btn-copy-block" class="ctx-action" title="Copy last command &amp; output block">⧉ Copy Output</button>
      </div>
    </footer>

    <div id="mobile-bar" class="mobile-bar hidden">
      <button data-key="Escape">Esc</button>
      <button data-key="Tab">Tab</button>
      <button id="mod-ctrl" data-mod="ctrl">Ctrl</button>
      <button id="mod-alt" data-mod="alt">Alt</button>
      <button data-seq="\x1b[A">↑</button>
      <button data-seq="\x1b[B">↓</button>
      <button data-seq="\x1b[D">←</button>
      <button data-seq="\x1b[C">→</button>
      <button data-seq="|">|</button>
      <button data-seq="/">/</button>
      <button data-seq="-">-</button>
      <button data-seq="~">~</button>
      <button data-seq="\x1b[H">Home</button>
      <button data-seq="\x1b[F">End</button>
      <button data-seq="\x1b[5~">PgUp</button>
      <button data-seq="\x1b[6~">PgDn</button>
      <button id="btn-mobile-paste">Paste</button>
    </div>
  </div>

  <!-- OTP Auth / Lock Overlay (never clears terminal canvas underneath) -->
  <div id="auth-overlay" class="auth-overlay">
    <div class="auth-card">
      <div class="auth-logo">
        <img class="auth-logo-img" src="./logo.svg?v=4" alt="oterm logo" width="64" height="64" />
        <div class="auth-logo-text"><span class="auth-prompt">$</span> oterm</div>
      </div>
      <h2 id="auth-title">OTP Verification</h2>
      <p id="auth-subtitle" class="auth-subtitle">
        Enter the 6-digit code from your authenticator app.
      </p>
      <form id="auth-form" autocomplete="off">
        <div id="otp-boxes" class="otp-boxes" aria-label="6-digit verification code">
          <input
            id="otp-input"
            class="otp-hidden-input"
            type="text"
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="6"
            autocomplete="one-time-code"
            aria-label="6-digit OTP code"
            autofocus
          />
          <div class="otp-slot" data-index="0"></div>
          <div class="otp-slot" data-index="1"></div>
          <div class="otp-slot" data-index="2"></div>
          <div class="otp-slot" data-index="3"></div>
          <div class="otp-slot" data-index="4"></div>
          <div class="otp-slot" data-index="5"></div>
        </div>
        <div id="otp-status" class="otp-status hidden">Verifying…</div>
      </form>
      <div id="auth-error" class="auth-error hidden"></div>
      <div class="auth-footnote">
        Server-bound TOTP · Persistent tmux sessions · Auto-locks when idle
      </div>
    </div>
  </div>

  <script type="module" src="./app.js?v=3"></script>
</body>
</html>
