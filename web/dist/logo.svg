<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Matte obsidian architectural base -->
    <linearGradient id="bg" x1="16" y1="8" x2="112" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#171C26"/>
      <stop offset="100%" stop-color="#0B0E14"/>
    </linearGradient>

    <!-- Subtle warm sunlit atmospheric glow (restrained, atmospheric, not loud) -->
    <radialGradient id="sun-glow" cx="0.72" cy="0.22" r="0.62">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#F59E0B" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0B0E14" stop-opacity="0"/>
    </radialGradient>

    <!-- Sculpted silver-white wave body -->
    <linearGradient id="wave-fill" x1="22" y1="92" x2="108" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="55%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Single warm signature accent along the wave crest & surfboard -->
    <linearGradient id="crest-gold" x1="24" y1="82" x2="108" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="55%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>

    <!-- Keyboard deck surface -->
    <linearGradient id="kbd-deck" x1="64" y1="82" x2="64" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E2533"/>
      <stop offset="100%" stop-color="#11151E"/>
    </linearGradient>
  </defs>

  <!-- Minimalist dark squircle frame -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#sun-glow)"/>
  <rect x="5" y="5" width="118" height="118" rx="27" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.5"/>

  <!-- === 1. UNMISTAKABLE PERSPECTIVE KEYBOARD (lower deck) === -->
  <path d="M18 84 L110 84 L116 111 C116.6 113.5 114.7 116 112 116 L16 116 C13.3 116 11.4 113.5 12 111 Z"
        fill="url(#kbd-deck)" stroke="#CBD5E1" stroke-opacity="0.28" stroke-width="1.4"/>

  <!-- Keyboard Row 1 (7 crisp sculpted keys) -->
  <g fill="#2A3346" stroke="#E2E8F0" stroke-opacity="0.22" stroke-width="0.9">
    <rect x="21" y="88" width="10.5" height="6.5" rx="1.8"/>
    <rect x="33.5" y="88" width="10.5" height="6.5" rx="1.8"/>
    <rect x="46" y="88" width="10.5" height="6.5" rx="1.8"/>
    <rect x="58.5" y="88" width="10.5" height="6.5" rx="1.8"/>
    <rect x="71" y="88" width="10.5" height="6.5" rx="1.8"/>
    <rect x="83.5" y="88" width="10.5" height="6.5" rx="1.8"/>
    <rect x="96" y="88" width="11.5" height="6.5" rx="1.8"/>
  </g>

  <!-- Keyboard Row 2 (6 sculpted keys) -->
  <g fill="#252E40" stroke="#E2E8F0" stroke-opacity="0.24" stroke-width="0.9">
    <rect x="19" y="96.5" width="13.5" height="6.5" rx="1.8"/>
    <rect x="34.5" y="96.5" width="11" height="6.5" rx="1.8"/>
    <rect x="47.5" y="96.5" width="11" height="6.5" rx="1.8"/>
    <rect x="60.5" y="96.5" width="11" height="6.5" rx="1.8"/>
    <rect x="73.5" y="96.5" width="11" height="6.5" rx="1.8"/>
    <rect x="86.5" y="96.5" width="22.5" height="6.5" rx="1.8"/>
  </g>

  <!-- Keyboard Row 3 (modifiers + unmistakable wide spacebar with subtle warm accent) -->
  <g fill="#1F2737" stroke="#E2E8F0" stroke-opacity="0.26" stroke-width="0.9">
    <rect x="17" y="105" width="14" height="7" rx="1.8"/>
    <rect x="33" y="105" width="11" height="7" rx="1.8"/>
    <rect x="46" y="105" width="36" height="7" rx="2" fill="#2D374B" stroke="#FBBF24" stroke-opacity="0.55"/>
    <rect x="84" y="105" width="11" height="7" rx="1.8"/>
    <rect x="97" y="105" width="14" height="7" rx="1.8"/>
  </g>

  <!-- === 2. BOLD SCULPTURAL WAVE RISING FROM THE KEYBOARD === -->
  <!-- Main curling wave silhouette (clean, architectural, high contrast) -->
  <path d="M16 84
           C28 84, 38 66, 56 61
           C72 56.5, 84 58, 97 49
           C103 44.5, 108 38, 109 32
           C114 43, 113 56, 104 64
           C94 72.5, 81 71, 68 74
           C52 77.5, 42 84, 16 84 Z"
        fill="url(#wave-fill)"/>

  <!-- Crisp luminous wave crest lip -->
  <path d="M21 82 C33 78, 42 64, 58 60 C74 56, 86 56.5, 98 48 C103 44.5, 107 39, 109 32"
        stroke="url(#crest-gold)" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Subtle curling inner wave contour -->
  <path d="M52 74 C66 67, 84 68, 98 58"
        stroke="#F8FAFC" stroke-opacity="0.32" stroke-width="1.4" stroke-linecap="round"/>

  <!-- === 3. ATHLETIC SCULPTED SURFER ON SURFBOARD (Olympic-pictogram clarity) === -->
  <!-- Sleek surfboard cutting cleanly along the wave face -->
  <path d="M40 58.5 C54 53.5, 70 50.5, 85 51.5 C73 57.5, 56 61.5, 40 58.5 Z"
        fill="#FBBF24"/>
  <path d="M44 58 C56 54.5, 69 52.5, 82 52.2"
        stroke="#FEF3C7" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Solid sculpted surfer silhouette (balanced athletic surfing stance) -->
  <g fill="#F8FAFC">
    <!-- Head -->
    <circle cx="67.5" cy="23.5" r="4.8"/>
    <!-- Sculpted torso + arms + bent legs in one crisp vector silhouette -->
    <path d="M62.5 29.8
             C64.2 28.6, 66.8 28.8, 68.2 30.2
             L79.5 26.8
             C81.0 26.3, 82.4 27.3, 82.4 28.7
             C82.4 29.8, 81.6 30.8, 80.4 31.1
             L69.2 35.0
             L66.8 41.8
             L73.5 47.0
             C74.4 47.7, 74.7 48.9, 74.2 50.0
             L71.2 54.6
             L66.5 54.8
             L68.4 49.4
             L62.0 44.8
             L56.8 48.8
             L54.0 56.0
             L49.4 56.6
             L52.0 46.8
             C52.3 45.8, 53.0 44.9, 53.9 44.3
             L59.4 40.2
             L61.2 34.4
             L49.8 36.6
             C48.4 36.9, 47.1 35.9, 47.0 34.5
             C46.9 33.3, 47.8 32.2, 49.0 32.0
             Z"/>
  </g>
</svg>
