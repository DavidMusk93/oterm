<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Deep cyberpunk obsidian base -->
    <linearGradient id="base" x1="8" y1="8" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A0E2E"/>
      <stop offset="52%" stop-color="#101326"/>
      <stop offset="100%" stop-color="#081829"/>
    </linearGradient>

    <!-- Warm, sunlit passionate ambient glow (feeling, not literal sun) -->
    <radialGradient id="warmth" cx="0.78" cy="0.22" r="0.72">
      <stop offset="0%" stop-color="#FFD000" stop-opacity="0.42"/>
      <stop offset="42%" stop-color="#FF5E3A" stop-opacity="0.22"/>
      <stop offset="78%" stop-color="#FF1E8E" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#101326" stop-opacity="0"/>
    </radialGradient>

    <!-- Cool cyber underglow on lower-left -->
    <radialGradient id="cyber" cx="0.2" cy="0.85" r="0.65">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#081829" stop-opacity="0"/>
    </radialGradient>

    <!-- Signature kinetic surf-wave ribbon: cyan -> hot magenta -> sunlit gold -->
    <linearGradient id="surf-wave" x1="18" y1="84" x2="108" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="46%" stop-color="#FF2A85"/>
      <stop offset="82%" stop-color="#FF7A2F"/>
      <stop offset="100%" stop-color="#FFE14D"/>
    </linearGradient>

    <!-- Secondary luminous crest highlight -->
    <linearGradient id="crest" x1="26" y1="74" x2="106" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DF9FF"/>
      <stop offset="55%" stop-color="#FF9E64"/>
      <stop offset="100%" stop-color="#FFF5B8"/>
    </linearGradient>

    <!-- Outer neon rim -->
    <linearGradient id="rim" x1="12" y1="116" x2="116" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#FF2A85" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#FFE14D" stop-opacity="0.95"/>
    </linearGradient>

    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle app icon container -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#base)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#warmth)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#cyber)"/>
  <rect x="5.5" y="5.5" width="117" height="117" rx="26.5" stroke="url(#rim)" stroke-width="2.2"/>

  <!-- Minimal geometric mechanical keyboard keycaps (tilted isometric energy) -->
  <g transform="rotate(-8 64 88)">
    <!-- Row 1 -->
    <rect x="20" y="76" width="16" height="11" rx="3.2" fill="#1C2242" stroke="#00F0FF" stroke-opacity="0.45" stroke-width="1.2"/>
    <rect x="40" y="76" width="16" height="11" rx="3.2" fill="#1C2242" stroke="#00F0FF" stroke-opacity="0.45" stroke-width="1.2"/>
    <rect x="60" y="76" width="16" height="11" rx="3.2" fill="#FF2A85" fill-opacity="0.32" stroke="#FF7A2F" stroke-opacity="0.85" stroke-width="1.2"/>
    <rect x="80" y="76" width="24" height="11" rx="3.2" fill="#1C2242" stroke="#FFE14D" stroke-opacity="0.55" stroke-width="1.2"/>

    <!-- Row 2 (glowing spacebar deck) -->
    <rect x="16" y="92" width="20" height="11" rx="3.2" fill="#171C38" stroke="#7B61FF" stroke-opacity="0.5" stroke-width="1.2"/>
    <rect x="40" y="92" width="44" height="11" rx="3.5" fill="#00F0FF" fill-opacity="0.22" stroke="#00F0FF" stroke-opacity="0.85" stroke-width="1.4"/>
    <rect x="88" y="92" width="20" height="11" rx="3.2" fill="#171C38" stroke="#FF2A85" stroke-opacity="0.55" stroke-width="1.2"/>
  </g>

  <!-- Abstract surging surf-wave + terminal '>' momentum ribbon slicing across the keys -->
  <path d="M18 76
           C32 76, 40 46, 62 42
           C76 39.5, 81 51, 95 45
           C103 41.5, 108 32, 111 25
           C108 42, 99 57, 84 62
           C68 67, 62 56, 48 63
           C36 69, 28 79, 18 76 Z"
        fill="url(#surf-wave)" filter="url(#neon)"/>

  <!-- Crisp sunlit top edge along the wave crest -->
  <path d="M24 72 C36 68, 43 45, 63 42 C76 40, 82 50, 96 44 C103 41, 108 33, 111 25"
        stroke="url(#crest)" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Minimal terminal prompt spark / cursor bar riding the momentum -->
  <path d="M27 33 L39 41 L27 49" stroke="#FFE14D" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon)"/>
  <line x1="44" y1="49" x2="54" y2="49" stroke="#00F0FF" stroke-width="3.4" stroke-linecap="round"/>
</svg>
